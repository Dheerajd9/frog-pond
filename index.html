<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100e" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frog Pond">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Eat That Frog daily planner: pick your frog, ABCDE lists, goals and the 21 rules.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Frog Pond Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
/* ===================================================================
   Frog Pond 2.0 design system
   Layout: mobile = one column + bottom tab bar + bottom sheets.
           tablet = wider column. desktop (>=1024) = left rail + 2-column Today.
   All values come from the tokens below. Business logic is untouched.
   =================================================================== */
:root{
  /* spacing (4-pt scale) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-12:48px; --s-16:64px;
  /* radius */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  /* type */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --t-hero:clamp(30px,7.5vw,38px); --t-title:clamp(26px,6.5vw,30px); --t-h2:20px; --t-h3:17px;
  --t-body:16px; --t-sm:14px; --t-xs:12.5px;
  /* motion */
  --d-micro:150ms; --d-ui:200ms; --d-screen:280ms; --d-sheet:320ms;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  /* layers */
  --z-nav:10; --z-ptr:25; --z-focus:40; --z-sheet:45; --z-toast:60;
  /* colors: light */
  --bg:#f5f6f3; --surface:#ffffff; --surface-2:#f0f2ee; --surface-3:#e8ebe6;
  --text:#121814; --text-2:#5a655e; --text-3:#87918a; --border:#e2e6e0; --border-strong:#cfd5cd;
  --accent:#1f8a4c; --accent-ink:#ffffff; --accent-soft:#e5f3ea; --accent-text:#176a3a;
  --warn:#b26a00; --warn-soft:#fff3dc; --danger:#c8322f; --danger-soft:#fde9e8; --info:#2563a8;
  --pA:#d93a36; --pA-soft:#fdeceb; --pB:#c27a06; --pB-soft:#fff3db; --pC:#2f74c0; --pC-soft:#e8f1fb;
  --pD:#7a55c9; --pD-soft:#f1ecfb; --pE:#6f7a73; --pE-soft:#eef0ee;
  --scrim:rgba(14,20,16,.38);
  --sh-1:0 1px 2px rgba(16,24,20,.05),0 1px 1px rgba(16,24,20,.03);
  --sh-2:0 10px 30px rgba(16,24,20,.08),0 2px 6px rgba(16,24,20,.04);
  --sh-3:0 -8px 40px rgba(16,24,20,.16);
  --nav-bg:rgba(255,255,255,.86);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d100e; --surface:#161a17; --surface-2:#1d221e; --surface-3:#252b26;
  --text:#ecf0ec; --text-2:#a3ada6; --text-3:#78837c; --border:#272d28; --border-strong:#353c36;
  --accent:#3fcf7d; --accent-ink:#04180b; --accent-soft:#16301f; --accent-text:#6fe0a0;
  --warn:#f0b445; --warn-soft:#2e2412; --danger:#ff6b63; --danger-soft:#33191a; --info:#7ab3f2;
  --pA:#ff6b63; --pA-soft:#381c1c; --pB:#f0b445; --pB-soft:#33270f; --pC:#6aa8ee; --pC-soft:#172a40;
  --pD:#b096f2; --pD-soft:#271f3d; --pE:#97a29b; --pE-soft:#222824;
  --scrim:rgba(0,0,0,.55);
  --sh-1:0 0 0 rgba(0,0,0,0); --sh-2:0 10px 30px rgba(0,0,0,.35); --sh-3:0 -8px 40px rgba(0,0,0,.5);
  --nav-bg:rgba(22,26,23,.86);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d100e; --surface:#161a17; --surface-2:#1d221e; --surface-3:#252b26;
  --text:#ecf0ec; --text-2:#a3ada6; --text-3:#78837c; --border:#272d28; --border-strong:#353c36;
  --accent:#3fcf7d; --accent-ink:#04180b; --accent-soft:#16301f; --accent-text:#6fe0a0;
  --warn:#f0b445; --warn-soft:#2e2412; --danger:#ff6b63; --danger-soft:#33191a; --info:#7ab3f2;
  --pA:#ff6b63; --pA-soft:#381c1c; --pB:#f0b445; --pB-soft:#33270f; --pC:#6aa8ee; --pC-soft:#172a40;
  --pD:#b096f2; --pD-soft:#271f3d; --pE:#97a29b; --pE-soft:#222824;
  --scrim:rgba(0,0,0,.55);
  --sh-1:0 0 0 rgba(0,0,0,0); --sh-2:0 10px 30px rgba(0,0,0,.35); --sh-3:0 -8px 40px rgba(0,0,0,.5);
  --nav-bg:rgba(22,26,23,.86);
  color-scheme:dark}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior-y:contain}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);font-size:var(--t-body);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(var(--s-4),env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(var(--s-4),env(safe-area-inset-left,0px))}
html.locked,html.locked body{overflow:hidden}
h1,h2,h3{margin:0;font-family:var(--font-round);letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
h1{font-size:var(--t-title);font-weight:800}
h2{font-size:var(--t-h2);font-weight:750}
h3{font-size:var(--t-h3);font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default;opacity:.5}
a{color:var(--accent-text)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.small{font-size:var(--t-sm)}
.xs{font-size:var(--t-xs)}
.src{font-size:var(--t-xs);color:var(--text-3);font-weight:600}
.eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:var(--s-3)}
.row{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}

/* ---------- app shell ---------- */
#app{max-width:640px;margin:0 auto;padding-block:var(--s-4) var(--s-8);display:flex;flex-direction:column;gap:var(--s-4)}
#app.enter{animation:screenIn var(--d-screen) var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-direction:column;gap:var(--s-1);padding-top:var(--s-2)}
.page-head p{color:var(--text-2)}
.today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-3);padding-top:var(--s-2)}
.today-head .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.today-head h1{font-size:var(--t-hero)}
.meta-row{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2)}
.avatar{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.on{background:var(--accent-soft);color:var(--accent-text)}
.acct{border:none;background:none;padding:0;color:var(--text-2);font-size:var(--t-sm);display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:28px}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .ic{width:16px;height:16px}

/* chips + status */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 var(--s-3);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-2);font-size:var(--t-sm);font-weight:600;border:none;white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip.accent{background:var(--accent-soft);color:var(--accent-text)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.sm{height:22px;padding:0 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 var(--s-3);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-2);font-size:var(--t-sm);font-weight:600;border:none}
.sync[data-s="synced"] .dot{background:var(--accent)}
.sync[data-s="saving"] .dot{background:var(--info);animation:pulse 1s ease-in-out infinite}
.sync[data-s="offline"] .dot,.sync[data-s="locked"] .dot{background:var(--warn)}
.sync[data-s="error"] .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);min-width:0;box-shadow:var(--sh-1)}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}
.card-head h2{font-size:var(--t-h3)}
.notice{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--surface-2);font-size:var(--t-sm)}
.notice .ic{color:var(--accent-text)}
.notice p{flex:1;min-width:0}

/* hero (the guide) */
.hero{position:relative;background:var(--surface);border-radius:var(--r-xl);padding:var(--s-6) var(--s-5) var(--s-5);display:flex;flex-direction:column;gap:var(--s-4);box-shadow:var(--sh-2);border:1px solid var(--border);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}
.hero.plan::before{background:var(--info)}
.hero.done::before{background:var(--warn)}
.hero-top{display:flex;align-items:center;gap:var(--s-3)}
.hero-top .frog{width:44px;height:44px;flex:none}
.hero .eyebrow{color:var(--accent-text)}
.hero.plan .eyebrow{color:var(--info)}
.hero-title{font-family:var(--font-round);font-size:clamp(24px,6vw,30px);font-weight:800;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.hero-sub{color:var(--text-2);font-size:15px}
.hero-meta{display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--t-sm)}
.hero-meta .line{display:flex;gap:var(--s-2);align-items:flex-start;color:var(--text-2)}
.hero-meta .line .ic{width:17px;height:17px;margin-top:1px;color:var(--text-3)}
.hero-meta b{color:var(--text);font-weight:600}
.hero-actions{display:flex;gap:var(--s-2);flex-wrap:wrap}
.hero-actions .btn{flex:1 1 auto}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);border-top:1px solid var(--border);padding-top:var(--s-3);margin-top:var(--s-1)}
.talk{border:none;background:none;padding:var(--s-1) 0;color:var(--accent-text);font-weight:700;font-family:var(--font-round);font-size:15px;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.talk .ic{width:15px;height:15px}

/* next + progress */
.next-row{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.next-row .txt{flex:1;min-width:0}
.next-row .txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.progress{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width var(--d-screen) var(--ease)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:44px;padding:0 var(--s-4);border-radius:var(--r-md);border:1px solid transparent;
  font-weight:650;font-size:15.5px;background:var(--surface-2);color:var(--text);transition:transform var(--d-micro) var(--ease),background-color var(--d-ui),opacity var(--d-ui);white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){filter:brightness(1.05)}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-secondary:hover:not(:disabled){background:var(--surface-3)}
.btn-soft{background:var(--accent-soft);color:var(--accent-text)}
.btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-plain{background:transparent;color:var(--accent-text);padding:0 var(--s-2)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-lg{min-height:54px;font-size:17px;border-radius:var(--r-lg)}
.btn-sm{min-height:36px;padding:0 var(--s-3);font-size:var(--t-sm);border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn[aria-busy="true"]{opacity:.7;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:var(--text-2);display:grid;place-items:center;flex:none;transition:background-color var(--d-ui),transform var(--d-micro) var(--ease)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.92)}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;font-size:var(--t-sm);font-weight:600;color:var(--text-2)}
.input,.field input,.field textarea,.field select{width:100%;min-height:46px;padding:11px 14px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  font-size:16px;font-weight:400;transition:border-color var(--d-ui),box-shadow var(--d-ui)}
.field textarea{min-height:76px;resize:vertical;line-height:1.4}
.input:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.add{display:flex;gap:var(--s-2);align-items:center}
.add .input{flex:1;min-width:0}
.add-plus{background:var(--surface-2);border-color:transparent}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:22px;height:22px;flex:none}

/* ---------- task rows ---------- */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks>li+li{border-top:1px solid var(--border)}
.task{position:relative;overflow:hidden;touch-action:pan-y}
.task .swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s-5);font-weight:700;font-size:var(--t-sm);opacity:0}
.task .swipe-bg .l{color:var(--accent-text)}
.task .swipe-bg .r{color:var(--text-2)}
.task.swiping .swipe-bg{opacity:1}
.task.swiping.right .swipe-bg{background:var(--accent-soft)}
.task.swiping.left .swipe-bg{background:var(--surface-2)}
.t-in{position:relative;display:flex;align-items:center;gap:var(--s-2);padding:6px 0;background:var(--surface);transition:transform var(--d-ui) var(--ease)}
.task.dragging .t-in{transition:none}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:6px 0;text-align:left;background:none;border:none;color:inherit;cursor:pointer}
.t-title{font-weight:550;line-height:1.3;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--t-xs);color:var(--text-3)}
.t-meta .late{color:var(--danger);font-weight:700}
.t-meta .frogtag{color:var(--accent-text);font-weight:700}
.task.done .t-title{color:var(--text-3);text-decoration:line-through;text-decoration-thickness:1.5px}
.check{width:44px;height:44px;border:none;background:none;padding:0;display:grid;place-items:center;flex:none;color:var(--accent)}
.check i{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;transition:all var(--d-ui) var(--ease)}
.check i svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset var(--d-ui) var(--ease) 60ms}
.check.on i{background:var(--accent);border-color:var(--accent)}
.check.on i svg{stroke-dashoffset:0}
.check:hover i{border-color:var(--accent)}
.task.completing .check i{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
.task.completing .check i svg{stroke-dashoffset:0}
.task.completing .t-title{color:var(--text-3)}
.task.completing,.task.removing{animation:collapse 260ms var(--ease) 140ms forwards}
@keyframes collapse{to{opacity:0;transform:translateX(12px)}}
.task.enter .t-in{animation:rowIn 320ms var(--ease)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.prio{min-width:44px;height:30px;padding:0 9px;border-radius:var(--r-sm);border:none;font-weight:800;font-size:13px;letter-spacing:.02em;display:inline-grid;place-items:center;flex:none;font-variant-numeric:tabular-nums;transition:transform var(--d-micro) var(--ease),background-color var(--d-ui)}
.prio:active{transform:scale(.94)}
.prio[data-l="A"]{background:var(--pA-soft);color:var(--pA)}
.prio[data-l="B"]{background:var(--pB-soft);color:var(--pB)}
.prio[data-l="C"]{background:var(--pC-soft);color:var(--pC)}
.prio[data-l="D"]{background:var(--pD-soft);color:var(--pD)}
.prio[data-l="E"]{background:var(--pE-soft);color:var(--pE)}
.prio[data-l=""]{background:transparent;color:var(--text-3);border:1.5px dashed var(--border-strong)}
.prio.pop{animation:popIn 300ms var(--ease-spring)}
@keyframes popIn{from{transform:scale(.7)}to{transform:scale(1)}}
.more-btn{width:40px;height:44px;border:none;background:none;color:var(--text-3);display:grid;place-items:center;flex:none;border-radius:var(--r-sm)}
.more-btn:hover{color:var(--text);background:var(--surface-2)}
.insight{display:flex;gap:var(--s-2);font-size:var(--t-sm);color:var(--text-2);background:var(--surface-2);border-radius:var(--r-md);padding:var(--s-3)}
.insight .ic{width:17px;height:17px;color:var(--warn);margin-top:1px}

/* ---------- empty + error ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-2);padding:var(--s-6) var(--s-4);color:var(--text-2)}
.empty .frog{width:52px;height:52px;opacity:.95}
.empty b{color:var(--text);font-size:var(--t-h3)}
.alert{display:flex;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--danger-soft);color:var(--text);font-size:var(--t-sm)}
.alert .ic{color:var(--danger);margin-top:1px}
.alert.ok{background:var(--accent-soft)}
.alert.ok .ic{color:var(--accent-text)}

/* ---------- habits / streak ---------- */
.habit-dots{display:flex;gap:6px}
.habit-dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-3)}
.habit-dots i.on{background:var(--accent)}
.hlist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:var(--s-1);min-height:48px}
.hrow+.hrow{border-top:1px solid var(--border)}
.hrow .txt{flex:1;min-width:0;font-size:15px}
.hrow .txt small{display:block;color:var(--text-3);font-size:var(--t-xs)}

<script>
(function(){
"use strict";
// ================= BOOK CONTENT (Eat That Frog!, Brian Tracy — retold simply) =================
// [title, what the book says (simple), what to do now (the chapter's "Eat That Frog!" exercise), where it lives in the app]
const RULES=[
 ["Set the table","Decide exactly what you want. Clear goals beat everything. Only about 3 in 100 people write their goals, and they get 5 to 10 times more done.","Write 10 goals for next year as if they are already true. Star the one that would change your life most.","goals"],
 ["Plan every day in advance","Think on paper. Every minute you plan saves up to 10 minutes of doing. 10 to 12 minutes of planning saves about 2 hours a day.","Make tomorrow's list tonight. Keep a big list, a month list, a week list and a day list.","lists"],
 ["Use the 80/20 rule on everything","2 jobs out of 10 are worth more than the other 8 together. Don't clear up small things first.","Before each job ask: is this in my top 20%?","today"],
 ["Think about what happens next","Important jobs have big results later, good or bad. Winners do what reaches the goal, not what feels easy now.","Ask: which one job, done really well, would help my life the most?","today"],
 ["Practice ABCDE every day","A = must do (big results). B = should do (small results, a tadpole). C = nice to do. D = give to someone. E = throw away. Number your A jobs A-1, A-2, A-3. A-1 is your frog.","Put a letter on every job before you start. Never do a B while an A is waiting.","today"],
 ["Focus on key result areas","Every job has 5 to 7 things you must be good at. Your weakest one sets how high you can go.","Score each area 1 to 10. Find the one skill that would help you most.","me"],
 ["Law of forced efficiency","There is never time for everything, but always time for the most important thing.","Ask the 3 questions: What are my highest-value jobs? What can only I do that makes a real difference? What is the best use of my time right now?","today"],
 ["Prepare well before you begin","Have everything ready before you start: papers, tools, passwords. Clear your desk. Sit up straight and say \"Let's get to work!\"","Clean your desk and lay out everything for tomorrow's frog.","today"],
 ["Do your homework","The better you get at a job, the faster you start and finish it. Keep learning all your life.","Read or learn in your field for about 1 hour every day.","today"],
 ["Use your special talents","You enjoy most the things you can be best at. Put your heart into those few things.","Answer: What am I really good at? What do I enjoy most? What made me successful before?","me"],
 ["Find your key blocker","One thing always sets your speed. Most blockers (about 80%) are inside you, not outside.","For your big goal ask: what is holding me back? Then do something about it today.","goals"],
 ["One oil barrel at a time","Crossing the desert, you only need to drive to the next barrel you can see. Go as far as you can see; then you will see further.","Pick a job you keep putting off and do just the next step now.","goals"],
 ["Put pressure on yourself","No one is coming to push you. Act as if you must leave town for a month tomorrow.","Give every job a deadline and beat it.","lists"],
 ["Look after your energy","Rested, you do 2 to 5 times more. Sleep early, eat well, move, and take one full day off each week.","Answer the 4 energy questions and act on them today.","me"],
 ["Cheer yourself on","How you talk to yourself decides most of how you feel. Look for the good, the lesson, and the solution.","Say: \"I like myself! I can do it! I feel terrific!\"","today"],
 ["Put off small things on purpose","You can't do everything, so choose what NOT to do. Say \"No\" often.","Ask: if I weren't doing this already, would I start it today? If not, stop it.","lists"],
 ["Do the hardest job first","Each morning start with your A-1 job before anything else. Do it for 21 days and it becomes a habit.","Just for today: plan, prepare and start your hardest job first.","today"],
 ["Slice and dice the job","Salami slice: cut the job into thin pieces and do one. Swiss cheese: work on it for just 5 or 10 minutes.","Slice a big job you have been avoiding, or Swiss-cheese it for 10 minutes.","today"],
 ["Make big chunks of time","Big work needs 30, 60 or 90 minutes with no phone and no breaks. Make appointments with yourself.","Book one focus block today and keep it.","today"],
 ["Feel the hurry","Move fast. Say \"Do it now! Do it now!\" Fast action builds momentum and a good name.","Pick one area where you delay and act fast in it from now on.","today"],
 ["Finish what you start","Once you start, keep going until it is 100% done. Stopping and starting can make a job take up to 5 times longer.","When you want to stop, say \"Back to work!\"","today"]
];
const LETTERS=["A","B","C","D","E",""];
const LETTER_INFO={A:"A = must do. Big results.",B:"B = should do. A tadpole.",C:"C = nice to do. No real results.",D:"D = give it to someone else.",E:"E = throw it away.","":"No letter yet. Tap to choose."};
const LISTS=[
  {id:"master",name:"Big list",hint:"Everything you might want to do some day. Catch every idea here and sort it later."},
  {id:"month",name:"Month",hint:"Make this at the end of each month for the month ahead. Pull jobs from the big list."},
  {id:"week",name:"Week",hint:"Plan the whole week before it starts. Add to it as the week goes."},
  {id:"day",name:"Today",hint:"Make it the night before. Undone jobs carry over to the next day."},
  {id:"no",name:"Not doing",hint:"Creative procrastination: jobs you decided NOT to do now, maybe never. Saying no makes room for frogs."}
];
const NEXT={master:"month",month:"week",week:"day"};
const TALK=["I like myself!","I can do it!","I feel terrific!","Do it now!","Back to work!","Just for today!"];
const QUESTIONS={
  talents:[["good","What am I really good at?"],["enjoy","What do I enjoy most about my work?"],["success","What has made me successful so far?"],["dream","If I could do any job at all, what would it be?"]],
  energy:[["more","What am I doing for my body that I should do more of?"],["less","What should I do less of?"],["start","What should I start doing to be at my best?"],["stop","What should I stop doing altogether?"]]
};
const HABITS=[
  ["goal","Did one thing for my big goal","Rule 1, step 7"],
  ["learn","Learned in my field (aim: 1 hour)","Rule 9"],
  ["move","Moved my body","Rule 14"],
  ["bed","In bed by 10 pm","Rule 14"],
  ["plan","Made tomorrow's list","Rule 2"]
];
const PLAN_STEPS=[
  ["carry","Undone jobs stay for tomorrow. Clear the finished ones.","clear"],
  ["add","Write down everything for tomorrow on Today's list.",""],
  ["letters","Put A, B, C, D or E on every job.",""],
  ["order","Put the A jobs in order. A-1 is your frog. Ask: what happens if I do it, or don't?",""],
  ["ready","Write what you need for the frog, lay it out and clear your desk.",""],
  ["sleep","Go to bed early. Your mind works on the list while you sleep.",""]
];

// ================= STATE =================
const KEY="frogpond.v2";
let state=null, syncMode="local", ai=null;
let ui={tab:"today",list:"day",open:null,panel:null,goalForm:false,talk:0};
try{const t=localStorage.getItem("frogpond.ui"); if(t){const o=JSON.parse(t); ui.tab=o.tab||"today"; ui.list=o.list||"day";}}catch(e){}

const uidGen=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const dkey=(d)=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip=(s,n)=>String(s).trim().slice(0,n||200);

function examples(){
  const T=(text,list,letter,rank,extra)=>Object.assign({id:uidGen(),text,list,letter,rank,done:false,created:Date.now(),ex:true,slices:[],need:"",due:""},extra||{});
  return {v:2,created:Date.now(),
    tasks:[
      T("Finish the hardest report","day","A",1,{need:"Laptop, last month's numbers, quiet room",slices:[{id:uidGen(),text:"Open the file and write the title",done:false},{id:uidGen(),text:"Write the first section",done:false},{id:uidGen(),text:"Check numbers and send",done:false}]}),
      T("Study 1 hour for my certificate","day","A",2),
      T("Call mom and dad","day","B",0),
      T("Reply to emails","day","C",0),
      T("Plan this week's meals","week","B",0),
      T("Plan the month budget","month","A",1),
      T("Learn to cook three new dishes","master","",0),
      T("Scrolling social media in the morning","no","E",0)
    ],
    goals:[{id:uidGen(),text:"I read 12 books this year",deadline:"",major:true,ex:true,blocker:"I scroll my phone at night instead of reading",steps:[{id:uidGen(),text:"Pick the first book",done:true},{id:uidGen(),text:"Read 20 pages every night",done:false},{id:uidGen(),text:"Keep the phone outside the bedroom",done:false}]},
           {id:uidGen(),text:"I run 5 km without stopping",deadline:"",major:false,ex:true,blocker:"",steps:[]}],
    kra:[{id:uidGen(),name:"Planning my day",score:6},{id:uidGen(),name:"Health and energy",score:5},{id:uidGen(),name:"Key work skill",score:7}],
    frogLog:{}, habits:{}, plan:{}, answers:{}, oneSkill:"", bestTime:"morning", dayOff:"Sunday"};
}
const safeId=v=>{v=String(v==null?"":v).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);return v||uidGen();};
const safeSub=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==="object").map(x=>({id:safeId(x.id),text:String(x.text||"").slice(0,300),done:!!x.done})):[];
const safeMap=o=>o&&typeof o==="object"&&!Array.isArray(o)?o:{};
function normalize(s){
  s=s&&typeof s==="object"?s:{};
  const tasks=Array.isArray(s.tasks)?s.tasks.filter(t=>t&&typeof t==="object").map(t=>({id:safeId(t.id),text:String(t.text||"").slice(0,300),list:["master","month","week","day","no"].includes(t.list)?t.list:"master",letter:["A","B","C","D","E"].includes(t.letter)?t.letter:"",rank:t.rank||(t.frog?1:0),done:!!t.done,doneAt:t.doneAt||null,created:t.created||Date.now(),ex:!!t.ex,slices:safeSub(t.slices),need:String(t.need||"").slice(0,300),due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||"")?t.due:"",u:+t.u||0})):[];
  const goals=Array.isArray(s.goals)?s.goals.filter(g=>g&&typeof g==="object").map((g,i)=>({id:safeId(g.id),text:String(g.text||"").slice(0,300),deadline:/^\d{4}-\d{2}-\d{2}$/.test(g.deadline||"")?g.deadline:"",major:g.major!=null?!!g.major:i===0,ex:!!g.ex,blocker:String(g.blocker||"").slice(0,300),steps:safeSub(g.steps),u:+g.u||0})):[];
  const o={v:2,created:s.created||Date.now(),tasks,goals,kra:Array.isArray(s.kra)?s.kra.filter(k=>k&&typeof k==="object").map(k=>({id:safeId(k.id),name:String(k.name||"").slice(0,80),score:Math.min(10,Math.max(1,+k.score||5)),u:+k.u||0})):[],frogLog:safeMap(s.frogLog),
    habits:safeMap(s.habits),plan:safeMap(s.plan),answers:safeMap(s.answers),
    oneSkill:String(s.oneSkill||"").slice(0,300),bestTime:["morning","afternoon","evening"].includes(s.bestTime)?s.bestTime:"morning",dayOff:["Saturday","Sunday"].includes(s.dayOff)?s.dayOff:"Sunday",tomb:safeMap(s.tomb),updatedAt:s.updatedAt||0};
  // old v1 frogLog stored `true`; keep it as a count
  fixRanks(o); return o;
}
function fixRanks(st){ ["master","month","week","day","no"].forEach(l=>{ const a=(st||state).tasks.filter(t=>t.list===l&&t.letter==="A"&&!t.done).sort((x,y)=>(x.rank||99)-(y.rank||99)||x.created-y.created); a.forEach((t,i)=>t.rank=i+1); }); }
function loadLocal(){try{const t=localStorage.getItem(KEY)||localStorage.getItem("frogpond.v1");return t?normalize(JSON.parse(t)):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function saveUI(){try{localStorage.setItem("frogpond.ui",JSON.stringify({tab:ui.tab,list:ui.list}))}catch(e){}}

function prune(){
  const cut=Date.now()-45*864e5, old=dkey(new Date(Date.now()-120*864e5));
  state.tasks=state.tasks.filter(t=>!t.done||!t.doneAt||t.doneAt>cut);
  ["habits","plan"].forEach(k=>Object.keys(state[k]).forEach(d=>{if(d<old) delete state[k][d]}));
}
// Change tracking: every task, goal and key area gets a "last changed" time (u),
// and deleted ones leave a tombstone, so two devices can be merged item by item.
let prevSig=null;
function sigOf(st){ const m={}; ["tasks","goals","kra"].forEach(k=>st[k].forEach(it=>{ const c=Object.assign({},it); delete c.u; m[k+"|"+it.id]=JSON.stringify(c); })); return m; }
function stamp(){
  const now=Date.now(), cur=sigOf(state);
  if(prevSig){
    const idx={}; ["tasks","goals","kra"].forEach(k=>state[k].forEach(it=>idx[k+"|"+it.id]=it));
    for(const key in cur) if(prevSig[key]!==cur[key]) idx[key].u=now;
    for(const key in prevSig) if(!(key in cur)) state.tomb[key.split("|")[1]]=now;
  }
  const old=now-90*864e5; for(const id in state.tomb) if(state.tomb[id]<old) delete state.tomb[id];
  state.updatedAt=now; prevSig=sigOf(state);
}
function commit(){ fixRanks(); prune(); stamp(); saveLocal(); render(); schedulePush(); }
function quietCommit(){ stamp(); saveLocal(); schedulePush(); }
function setSync(m){ if(m) syncMode=m; const el=document.getElementById("sync"); if(!el) return;
  const L={local:"On this device",synced:"Synced",saving:"Syncing…",offline:"Offline",locked:"Locked",error:"Sync paused"};
  el.setAttribute("data-s",syncMode); el.innerHTML=`<span class="dot"></span><span>${L[syncMode]||L.local}</span>`;
  el.setAttribute("aria-label","Sync: "+(L[syncMode]||L.local)+". Open sync settings");
}

// ================= HELPERS =================
const byId=id=>state.tasks.find(t=>t.id===id);
const goalById=id=>state.goals.find(g=>g.id===id);
const order={A:0,B:1,C:2,D:3,E:4,"":5};
function sorted(list){return state.tasks.filter(t=>t.list===list).sort((a,b)=>(a.done-b.done)||(order[a.letter||""]-order[b.letter||""])||((a.rank||0)-(b.rank||0))||(a.created-b.created))}
function a1(){return state.tasks.filter(t=>t.list==="day"&&t.letter==="A"&&!t.done).sort((a,b)=>a.rank-b.rank)[0]}
function streak(){let n=0;const d=new Date();if(!state.frogLog[dkey(d)]) d.setDate(d.getDate()-1);while(state.frogLog[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function todayHabits(){const k=dkey();return state.habits[k]||(state.habits[k]={})}
function majorGoal(){return state.goals.find(g=>g.major)}
function nextBarrel(g){return g&&g.steps.find(s=>!s.done)}
let toastTimer=null;
function toast(msg,action){
  const old=document.querySelector(".toast"); if(old) old.remove(); clearTimeout(toastTimer);
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite");
  const sp=document.createElement("span"); sp.textContent=msg; t.appendChild(sp);
  if(action){ const b=document.createElement("button"); b.type="button"; b.textContent=action.label; b.addEventListener("click",ev=>{ ev.stopPropagation(); t.remove(); action.fn(); }); t.appendChild(b); }
  document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add("show"));
  toastTimer=setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),250); },action?4500:2600);
}
function letterLabel(t){return t.letter==="A"&&!t.done&&t.rank?"A-"+t.rank:(t.letter||"?")}

// ================= PRESENTATION (Frog Pond 2.0) =================
// Everything below only builds markup and handles UI motion. Data changes still go through
// the same actions (data-act / data-form) and commit() as before.
const I=(name,cls)=>`<svg class="ic${cls?" "+cls:""}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const FROG=(full,cls)=>`<svg class="${cls||"frog"}" aria-hidden="true"><use href="#${full?"frogfull":"frog"}"/></svg>`;
const reduceMotion=()=>!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const CHECK=`<i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></i>`;

const discKey=t=>String(t).replace(/<[^>]*>/g,"").replace(/[^A-Za-z0-9]+/g,"-").slice(0,40);
const discOpen=(k,def)=>ui.discs&&k in ui.discs?ui.discs[k]:!!def;
function help(title,items){ const k="h-"+discKey(title); return `<details class="disc help" data-k="${k}"${discOpen(k,false)?" open":""}><summary>${I("help")}<span>${title}</span>${I("chev","chev")}</summary><div class="disc-body"><ol class="steps">${items.map(x=>`<li>${x}</li>`).join("")}</ol></div></details>`; }
function disc(icon,title,body,open,extra){ const k="d-"+discKey(title); return `<details class="disc" data-k="${k}"${discOpen(k,open)?" open":""}${extra||""}><summary>${I(icon)}<span>${title}</span>${I("chev","chev")}</summary><div class="disc-body">${body}</div></details>`; }
function emptyState(title,text,btn){ return `<div class="empty">${FROG(false)}<b>${title}</b><p>${text}</p>${btn||""}</div>`; }

// ---- "Do this now" guide (same decision logic as before) ----
function nextStep(){
  const today=dkey(), hour=new Date().getHours(), eaten=!!state.frogLog[today];
  const open=state.tasks.filter(t=>t.list==="day"&&!t.done);
  const noLetter=open.filter(t=>!t.letter);
  const f=a1(); const planDone=!!(todayHabits().plan);
  if(hour>=21&&!planDone) return {k:"9 pm · planning time",what:"Plan tomorrow. It takes 10 minutes.",btn:"Start planning",act:"wizard",kind:"plan"};
  if(!open.length&&!eaten) return {k:"Start here",what:"Write down what you need to do today.",btn:"Add a job",act:"focusadd",kind:"empty"};
  if(noLetter.length) return {k:"Next step",what:`Give a letter to “${noLetter[0].text}”. Is it a must-do (A) or not?`,btn:"Choose letter",act:"letter",id:noLetter[0].id,kind:"letter"};
  if(!f&&!eaten) return {k:"Next step",what:"Pick your frog: give your most important job the letter A.",btn:"Choose a job",act:"letter",id:open[0].id,kind:"letter"};
  if(f&&!eaten) return {k:"Do this now",what:`Eat your frog: “${f.text}”. Nothing else first.`,btn:"Start eating",act:"focus",id:f.id,kind:"frog"};
  const nx=open.filter(t=>t.letter!=="E"&&t.letter!=="D").sort((a,b)=>(order[a.letter]-order[b.letter])||(a.rank-b.rank))[0];
  if(nx) return {k:"Next job",what:`Frog eaten. Next: “${nx.text}”.`,btn:"Start timer",act:"focus",id:nx.id,kind:"next"};
  return hour>=21?{k:"All done",what:"Today's list is done. Now plan tomorrow.",btn:"Start planning",act:"wizard",kind:"plan"}:{k:"All done",what:"Today's list is done. Planning for tomorrow opens at 9 pm.",btn:"Add another job",act:"focusadd",kind:"done"};
}
function bestStreak(){ const ds=Object.keys(state.frogLog).filter(k=>state.frogLog[k]).sort(); let best=0,cur=0,prev=null;
  ds.forEach(k=>{ const d=new Date(k+"T12:00:00"); cur=(prev&&Math.round((d-prev)/864e5)===1)?cur+1:1; best=Math.max(best,cur); prev=d; }); return best; }
function greeting(){ const h=new Date().getHours(); return h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }

const LMEAN={A:["Must do","Big results if done, big trouble if not. Your frogs."],B:["Should do","Small results. A tadpole. Only after all A jobs."],C:["Nice to do","No real results either way."],D:["Give away","Someone else can do it. Ask them."],E:["Throw away","Not worth doing. Delete it or put it on Not doing."]};
const LIST_ICON={master:"bulb",month:"cal",week:"list",day:"today",no:"x"};

document.addEventListener("toggle",e=>{ const d=e.target; if(d&&d.tagName==="DETAILS"&&d.dataset.k){ ui.discs=ui.discs||{}; ui.discs[d.dataset.k]=d.open; } },true);
// ================= SHEETS (bottom sheet on phone, centered dialog on desktop) =================
const layer=document.getElementById("layer");
let layerToken=0, sheetOpener=null;
function lockScroll(on){ document.documentElement.classList.toggle("locked",!!on); }
function focusables(root){ return [...root.querySelectorAll('button:not([disabled]),[href],input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null||el===document.activeElement); }
function sheetMarkup(c){
  return `<div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><div class="t">${c.eyebrow?`<div class="eyebrow">${c.eyebrow}</div>`:""}<h2 id="sheet-title">${c.title}</h2>${c.sub?`<p class="muted small">${c.sub}</p>`:""}</div>
      ${c.noX?"":`<button class="icon-btn" data-close="1" aria-label="Close">${I("x")}</button>`}</div>
    <div class="sheet-body">${c.body}</div>`;
}
function sheetContent(s){
  if(s.kind==="task") return taskSheet(byId(s.id));
  if(s.kind==="letter") return letterSheet(byId(s.id));
  if(s.kind==="wiz") return wizSheet();
  if(s.kind==="tour") return tourSheet(s.n||0);
  if(s.kind==="guide") return guideSheet();
  if(s.kind==="prep") return prepSheet(s.id?byId(s.id):null);
  return null;
}
function openSheet(kind,opts){
  const s=Object.assign({kind},opts||{}); const c=sheetContent(s); if(!c) return;
  const replacing=!!layer.querySelector(".sheet")&&!layer.classList.contains("closing");
  ui.sheet=s; layerToken++;
  if(!replacing){ const ae=document.activeElement; sheetOpener=ae&&ae.dataset?{act:ae.dataset.act,id:ae.dataset.id}:null; }
  layer.className=replacing?"open":"";
  layer.innerHTML=`<div class="scrim" data-close="1"></div><div class="sheet${c.cls?" "+c.cls:""}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">${sheetMarkup(c)}</div>`;
  lockScroll(true);
  if(!replacing) requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add("open")));
  const sh=layer.querySelector(".sheet");
  setTimeout(()=>{ const f=c.focus?sh.querySelector(c.focus):null; (f||sh).focus({preventScroll:true}); },replacing?0:60);
}
function refreshSheet(){
  if(!ui.sheet) return; const sh=layer.querySelector(".sheet"); if(!sh||layer.classList.contains("closing")) return;
  const c=sheetContent(ui.sheet); if(!c){ closeLayer(); return; }
  const ae=document.activeElement, aid=ae&&sh.contains(ae)?ae.id:null;
  const typing=aid&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&!keepCleared?{v:ae.value,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const body=sh.querySelector(".sheet-body"), st=body?body.scrollTop:0;
  sh.innerHTML=sheetMarkup(c);
  const nb=sh.querySelector(".sheet-body"); if(nb) nb.scrollTop=st;
  if(aid){ const el=sh.querySelector("#"+CSS.escape(aid)); if(el){ el.focus({preventScroll:true}); if(typing&&el.value!==typing.v){ el.value=typing.v; try{el.setSelectionRange(typing.s,typing.e)}catch(x){} } } }
  else if(c.focus&&ui.wizFocus){ const el=sh.querySelector(c.focus); if(el) el.focus({preventScroll:true}); ui.wizFocus=false; }
}
function closeLayer(){
  stopTimer(); ui.wiz=null; ui.sheet=null; const tok=++layerToken;
  const hasSheet=!!layer.querySelector(".sheet");
  const finish=()=>{ if(tok!==layerToken) return; layer.innerHTML=""; layer.className=""; lockScroll(false);
    if(sheetOpener){ const sel=`[data-act="${sheetOpener.act}"]`+(sheetOpener.id?`[data-id="${sheetOpener.id}"]`:""); const el=sheetOpener.act&&document.querySelector(sel); if(el) el.focus({preventScroll:true}); sheetOpener=null; } };
  if(hasSheet&&!reduceMotion()){ layer.classList.remove("open"); layer.classList.add("closing"); setTimeout(finish,210); } else finish();
}
document.addEventListener("keydown",e=>{
  if(!layer.innerHTML) return;
  const dlg=layer.querySelector('[role="dialog"]'); if(!dlg) return;
  if(e.key==="Escape"){ e.preventDefault(); closeLayer(); return; }
  if(e.key==="Tab"){ const f=focusables(dlg); if(!f.length) return; const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||!dlg.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } }
});

// ---- sheet: task actions + edit ----
function taskSheet(t){
  if(!t) return null;
  const aList=state.tasks.filter(x=>x.list===t.list&&x.letter==="A"&&!x.done).sort((a,b)=>a.rank-b.rank);
  const sl=t.slices||[]; const listName=(LISTS.find(l=>l.id===t.list)||{}).name||"";
  const moves=LISTS.filter(l=>l.id!==t.list).map(l=>`<button class="btn btn-sm btn-secondary" data-act="move" data-to="${l.id}" data-id="${t.id}" data-close="1">${I(LIST_ICON[l.id])}${l.id==="week"&&t.list==="day"?"Not today → Week":l.name}</button>`).join("");
  const body=`
    <form class="add" data-form="rename" data-id="${t.id}"><label class="sr" for="ts-title">Job name</label><input class="input" id="ts-title" value="${esc(t.text)}" maxlength="300" autocomplete="off"><button class="btn btn-secondary">Save</button></form>
    <div class="stack"><div class="sec-title">Priority</div>
      <div class="minil" role="group" aria-label="Priority">${["A","B","C","D","E"].map(l=>`<button data-act="setletter" data-id="${t.id}" data-l="${l}" aria-pressed="${t.letter===l}" aria-label="${l}: ${LMEAN[l][0]}">${l}</button>`).join("")}<button data-act="setletter" data-id="${t.id}" data-l="" aria-pressed="${!t.letter}" aria-label="No letter">–</button></div>
      <p class="xs muted">${t.letter?`<b>${t.letter}</b> · ${LMEAN[t.letter][0]}. ${LMEAN[t.letter][1]}`:"A must do · B should do · C nice to do · D give away · E throw away"}</p>
      ${t.letter==="A"&&!t.done&&aList.length>1?`<div class="spread"><span class="small">Order: <b>A-${t.rank}</b> of ${aList.length}${t.list==="day"&&t.rank===1?" · your frog":""}</span><span class="row" style="flex-wrap:nowrap"><button class="btn btn-sm btn-secondary" data-act="up" data-id="${t.id}" ${t.rank===1?"disabled":""}>${I("up")}Up</button><button class="btn btn-sm btn-secondary" data-act="down" data-id="${t.id}" ${t.rank===aList.length?"disabled":""}>${I("down")}Down</button></span></div>`:""}
    </div>
    <div class="opt-list">
      ${!t.done?`<button class="opt" data-act="focus" data-id="${t.id}">${I("timer")}<span class="txt">Start focus timer<small>10, 30, 60 or 90 minutes</small></span>${I("chev","chev")}</button>`:""}
      <button class="opt" data-act="done" data-id="${t.id}" data-close="1">${I("check")}<span class="txt">${t.done?"Mark as not done":"Mark as done"}</span></button>
      <button class="opt" data-act="aislice" data-id="${t.id}">${I("spark")}<span class="txt">AI: slice it for me<small>${ai?"Free Gemini helper":"Add a free Gemini key in Me → Settings"}</small></span></button>
    </div>
    <div class="stack"><div class="sec-title">Slices${sl.length?` · ${sl.filter(s=>s.done).length} of ${sl.length} done`:""}</div>
      ${sl.length?`<ul class="steplist">${sl.map(s=>`<li class="${s.done?"done":""}"><button class="check ${s.done?"on":""}" aria-label="Slice done: ${esc(s.text)}" data-act="slicedone" data-id="${t.id}" data-s="${s.id}">${CHECK}</button><span class="txt">${esc(s.text)}</span><button class="icon-btn" aria-label="Remove slice" data-act="slicedel" data-id="${t.id}" data-s="${s.id}">${I("x")}</button></li>`).join("")}</ul>`:`<p class="small muted">Big job? Cut it into thin slices of 5 to 25 minutes and do one. (Rule 18)</p>`}
      <form class="add" data-form="slice" data-id="${t.id}"><label class="sr" for="slice-in">New slice</label><input class="input" id="slice-in" placeholder="Add a thin slice…" autocomplete="off"><button class="btn btn-secondary" aria-label="Add slice">${I("plus")}</button></form>
    </div>
    <form class="stack" data-form="edit" data-id="${t.id}"><div class="sec-title">Deadline &amp; get ready</div>
      <label class="field">Deadline (Rule 13)<input type="date" id="due-in" value="${esc(t.due)}"></label>
      <label class="field">What I need ready before I start (Rule 8)<input id="need-in" value="${esc(t.need)}" placeholder="Laptop, notes, water…"></label>
      <button class="btn btn-secondary">Save</button></form>
    <div class="stack"><div class="sec-title">Move to</div><div class="row">${moves}</div></div>
    <div class="opt-list"><button class="opt danger" data-act="del" data-id="${t.id}" data-close="1">${I("trash")}<span class="txt">Delete job</span></button></div>`;
  return {title:"Edit job",eyebrow:`${listName}${t.list==="day"&&t===a1()?" · 🐸 frog":""}`,body};
}

const WIZ=["Clear finished jobs","Add tomorrow's jobs","Give each job a letter","Order your A jobs","Get ready","All set"];
function openWizard(step){ ui.wiz=step||0; openSheet("wiz"); }
function renderWiz(){ if(ui.wiz==null) return; if(ui.sheet&&ui.sheet.kind==="wiz"&&layer.querySelector(".sheet")) refreshSheet(); else openSheet("wiz"); }
function wizSheet(){
  if(ui.wiz==null) return null;
  const n=ui.wiz, day=state.tasks.filter(t=>t.list==="day"&&!t.done), doneN=state.tasks.filter(t=>t.list==="day"&&t.done).length;
  const as=day.filter(t=>t.letter==="A").sort((a,b)=>a.rank-b.rank), f=as[0];
  let body="";
  if(n===0) body=`<p>Finished jobs leave the list. Unfinished jobs stay for tomorrow.</p><div class="notice">${I("check")}<p><b>${doneN}</b> finished job${doneN===1?"":"s"} on today's list.</p>${doneN?`<button class="btn btn-sm btn-primary" data-act="clearDone">Clear</button>`:""}</div>`;
  if(n===1){ const wk=state.tasks.filter(t=>t.list==="week"&&!t.done).slice(0,8);
    body=`<p>Write everything you must do tomorrow.</p><form class="add" data-form="wizadd"><label class="sr" for="wiz-in">New job</label><input class="input" id="wiz-in" placeholder="Type a job…" autocomplete="off"><button class="btn btn-primary">Add</button></form>
    ${day.length?`<div class="stack"><div class="sec-title">On tomorrow's list · ${day.length}</div><p class="small muted">${day.map(t=>esc(t.text)).join(" · ")}</p></div>`:""}
    ${wk.length?`<div class="stack"><div class="sec-title">From your week list</div><div class="row">${wk.map(t=>`<button class="btn btn-sm btn-secondary" data-act="move" data-to="day" data-id="${t.id}">${I("plus")}${esc(t.text)}</button>`).join("")}</div></div>`:""}`; }
  if(n===2) body=day.length?`<p class="small muted">A must do · B should do · C nice to do · D give away · E throw away</p><div>${day.map(t=>`<div class="wrow"><span class="wt">${esc(t.text)}</span><div class="minil">${["A","B","C","D","E"].map(l=>`<button data-act="setletter" data-id="${t.id}" data-l="${l}" aria-pressed="${t.letter===l}" aria-label="${l}: ${LMEAN[l][0]}">${l}</button>`).join("")}</div></div>`).join("")}</div>`:`<div class="notice">${I("help")}<p>No jobs yet. Go back one step and add some.</p></div>`;
  if(n===3) body=as.length?`<p>Put the most important A job on top. Which one has the biggest result if done, or the biggest trouble if not? <b>The top one is your frog.</b></p><div>${as.map((t,i)=>`<div class="wrow"><span class="wt">${i===0?"🐸 ":""}A-${i+1} · ${esc(t.text)}</span>${as.length>1?`<div class="row"><button class="btn btn-sm btn-secondary" data-act="up" data-id="${t.id}" ${i===0?"disabled":""}>${I("up")}Up</button><button class="btn btn-sm btn-secondary" data-act="down" data-id="${t.id}" ${i===as.length-1?"disabled":""}>${I("down")}Down</button></div>`:""}</div>`).join("")}</div>`:`<div class="notice">${I("help")}<p><b>No A job yet.</b> Go back and give your most important job the letter A. Every day needs one frog.</p></div>`;
  if(n===4) body=f?`<p>Your frog: <b>${esc(f.text)}</b></p><form class="stack" data-form="wizneed"><label class="field">What do I need ready for it?<input id="wiz-need" value="${esc(f.need)}" placeholder="Laptop, notes, water…"></label><button class="btn btn-secondary">Save</button></form><p class="small muted">Now lay those things out and clear your desk, so you can start the moment you sit down. (Rule 8)</p>`:`<div class="notice">${I("help")}<p>Pick a frog first (step 4).</p></div>`;
  if(n===5) body=`<div class="empty" style="padding:var(--s-2) 0">${FROG(true)}<b>Your plan is ready</b><p>${f?`Tomorrow's frog: <b>${esc(f.text)}</b>. `:""}Go to bed early. In the morning, open the app and tap <b>Start focus</b>.</p></div>`;
  body+=`<div class="sheet-foot">${n?`<button class="btn btn-ghost" data-act="wiz" data-step="${n-1}">Back</button>`:`<button class="btn btn-ghost" data-act="wizclose">Close</button>`}
    ${n<WIZ.length-1?`<button class="btn btn-primary" data-act="wiz" data-step="${n+1}">Next</button>`:`<button class="btn btn-primary" data-act="wizfinish">Done, good night</button>`}</div>`;
  return {title:WIZ[n],eyebrow:`Plan tomorrow · step ${n+1} of ${WIZ.length}`,focus:n===1?"#wiz-in":null,
    body:`<div class="steps-bar" aria-hidden="true">${WIZ.map((_,i)=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>${body}`};
}

// Focus timer: Swiss cheese (10 min) and large chunks (30/60/90). Rules 8, 18, 19, 20, 21.
let timer={id:null,end:0,task:null,mins:0,lock:null,paused:false,left:0};
function stopTimer(){if(timer.id)clearInterval(timer.id);timer.id=null;timer.paused=false;try{timer.lock&&timer.lock.release()}catch(e){}timer.lock=null;}
function openFocus(taskId){ timer.task=taskId||null; openSheet("prep",{id:taskId||null}); }
const RING_C=2*Math.PI*54;
function startTimer(mins){
  timer.mins=mins; timer.end=Date.now()+mins*60000; timer.paused=false;
  const t=timer.task?byId(timer.task):null;
  layerToken++; ui.sheet=null; layer.className="";
  layer.innerHTML=`<div class="focus" role="dialog" aria-modal="true" aria-label="Focus timer">
    <button class="icon-btn top-x" data-close="1" aria-label="End focus">${I("x")}</button>
    ${FROG(false)}
    <div class="eyebrow">Focus · stay with this one job · Rule 21</div>
    <div class="ftask">${t?esc(t.text):"My most important job"}</div>
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/><circle class="bar" id="ringbar" cx="60" cy="60" r="54" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg>
      <div class="time"><b id="clock" aria-live="off">${mins}:00</b><small id="clock-sub">of ${mins} min</small></div></div>
    <p class="cheer" id="cheer" aria-live="polite">Let's get to work!</p>
    <div class="actions">
      <button class="btn btn-secondary" id="pausebtn">${I("pause")}<span>Pause</span></button>
      <button class="btn btn-ghost" id="backbtn">I got distracted</button>
      ${t?`<button class="btn btn-primary" data-act="done" data-id="${t.id}" data-close="1">${I("check")}Finished it!</button>`:""}
    </div>
    <button class="btn btn-plain" data-close="1">End session</button></div>`;
  lockScroll(true);
  if(timer.id)clearInterval(timer.id); timer.id=null;
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>timer.lock=l).catch(()=>{})}catch(e){}
  const tick=()=>{ if(timer.paused) return; const left=Math.max(0,timer.end-Date.now()); const m=Math.floor(left/60000),s=Math.floor(left%60000/1000); const c=document.getElementById("clock"); if(!c){stopTimer();return}
    c.textContent=m+":"+String(s).padStart(2,"0"); const rb=document.getElementById("ringbar"); if(rb) rb.setAttribute("stroke-dashoffset",String(RING_C*(1-left/(timer.mins*60000))));
    if(left<=0){ clearInterval(timer.id); timer.id=null; document.getElementById("cheer").innerHTML="<b>Time's up!</b> Feel like one more slice? Once you start, it is easier to keep going."; const pb=document.getElementById("pausebtn"); if(pb) pb.hidden=true; } };
  tick(); timer.id=setInterval(tick,500);
  setTimeout(()=>{ const pb=document.getElementById("pausebtn"); if(pb) pb.focus({preventScroll:true}); },50);
}
function togglePause(){
  const pb=document.getElementById("pausebtn"); if(!pb) return;
  if(!timer.paused){ timer.paused=true; timer.left=Math.max(0,timer.end-Date.now()); pb.innerHTML=I("play")+"<span>Resume</span>"; const c=document.getElementById("cheer"); if(c) c.textContent="Paused. Come back to this same job."; }
  else { timer.paused=false; timer.end=Date.now()+timer.left; pb.innerHTML=I("pause")+"<span>Pause</span>"; const c=document.getElementById("cheer"); if(c) c.innerHTML="<b>Back to work!</b>"; }
}

// ================= SWIPE + LONG PRESS ON TASK ROWS =================
(function(){
  const app=document.getElementById("app"); let sw=null;
  const reset=li=>{ const inn=li&&li.querySelector(".t-in"); if(inn) inn.style.transform=""; if(li) li.classList.remove("swiping","dragging","left","right"); };
  app.addEventListener("touchstart",e=>{
    const li=e.target.closest("li.task"); if(!li||e.touches.length!==1||e.target.closest("input,textarea,select")) { sw=null; return; }
    sw={li,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,mode:null};
    sw.lp=setTimeout(()=>{ if(sw&&!sw.mode){ sw.mode="press"; try{navigator.vibrate&&navigator.vibrate(8)}catch(x){} openTaskSheet(li.dataset.id); } },550);
  },{passive:true});
  app.addEventListener("touchmove",e=>{
    if(!sw) return; const dx=e.touches[0].clientX-sw.x, dy=e.touches[0].clientY-sw.y;
    if(!sw.mode){ if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){ sw.mode="swipe"; clearTimeout(sw.lp); sw.li.classList.add("swiping","dragging"); } else if(Math.abs(dy)>10){ clearTimeout(sw.lp); sw=null; return; } else return; }
    if(sw.mode!=="swipe") return;
    if(e.cancelable) e.preventDefault();
    sw.dx=Math.max(-130,Math.min(130,dx)); const inn=sw.li.querySelector(".t-in"); inn.style.transform=`translateX(${sw.dx}px)`;
    sw.li.classList.toggle("right",sw.dx>0); sw.li.classList.toggle("left",sw.dx<0);
  },{passive:false});
  const end=()=>{ if(!sw) return; clearTimeout(sw.lp); const {li,dx,mode}=sw; sw=null;
    if(mode==="press"){ swallowClick=true; setTimeout(()=>swallowClick=false,450); return; }
    if(mode!=="swipe") return; li.classList.remove("dragging");
    if(dx>80){ const t=byId(li.dataset.id); reset(li); if(t) animatedDone(t,li); }
    else if(dx<-80){ reset(li); openTaskSheet(li.dataset.id); }
    else reset(li);
    swallowClick=true; setTimeout(()=>swallowClick=false,350); };
  app.addEventListener("touchend",end); app.addEventListener("touchcancel",end);
  app.addEventListener("contextmenu",e=>{ const li=e.target.closest("li.task"); if(!li||e.target.closest("input,textarea")) return; e.preventDefault(); openTaskSheet(li.dataset.id); });
})();

function makeAI(){

    if(!navigator.onLine) throw {code:"offline"};
    let r;
    try{ r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(cfg.model||"gemini-2.5-flash")+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.4}})}); }
    catch(e){ throw {code:"offline"}; }
    if(!r.ok){ throw {code:r.status===429?"rate_limited":(r.status===400||r.status===401||r.status===403||r.status===404)?"bad_key":"http"}; }
    const j=await r.json();
    const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
    return JSON.parse(txt.replace(/^\s*```(json)?/,"").replace(/```\s*$/,"").trim());

function setLetter(t,l){ t.letter=l; if(l==="A"){ t.rank=state.tasks.filter(x=>x.list===t.list&&x.letter==="A"&&!x.done&&x!==t).length+1; } }
function eatFrog(t){ if(!state.frogLog[dkey()]){ state.frogLog[dkey()]=t.id; return true; } return false; }
// Complete / un-complete a task (same rules as before: tadpole warning, frog log, undo).
function doDone(t){
  if(!t) return;
  const wasA1=t===a1();
  if(!t.done&&(t.letter==="B"||t.letter==="C")&&t.list==="day"&&a1()){ toast("Tadpole before frog! Never do a "+t.letter+" while an A is left. (Rule 5)"); }
  t.done=!t.done; t.doneAt=t.done?Date.now():null;
  if(t.done&&wasA1&&eatFrog(t)){ commit(); party(); return; }
  if(!t.done&&state.frogLog[dkey()]===t.id){ state.frogLog[dkey()]=""; t.letter="A"; t.rank=0.5; }
  commit();
}
// Play the check + collapse animation first, then apply the change.
function animatedDone(t,li){
  if(!t) return;
  if(li&&!t.done&&!reduceMotion()){ li.classList.add("completing"); setTimeout(()=>doDone(t),330); }
  else doDone(t);
}

document.addEventListener("click",e=>{

function mergeState(L,R){
  const newer=(R.updatedAt||0)>(L.updatedAt||0)?R:L, older=newer===R?L:R;
  const out=normalize(JSON.parse(JSON.stringify(newer)));
  const tomb={}; [L.tomb||{},R.tomb||{}].forEach(t=>{for(const k in t) tomb[k]=Math.max(tomb[k]||0,t[k])});
  ["tasks","goals","kra"].forEach(k=>{
    const m=new Map(); newer[k].forEach(it=>m.set(it.id,it));
    older[k].forEach(it=>{const ex=m.get(it.id); if(!ex||(it.u||0)>(ex.u||0)) m.set(it.id,it);});
    out[k]=JSON.parse(JSON.stringify([...m.values()].filter(it=>!(tomb[it.id]&&tomb[it.id]>=(it.u||0)))));
  });
  ["frogLog","answers"].forEach(k=>out[k]=Object.assign({},older[k],newer[k]));
  ["habits","plan"].forEach(k=>{const o={}; new Set([...Object.keys(older[k]),...Object.keys(newer[k])]).forEach(d=>o[d]=Object.assign({},older[k][d],newer[k][d])); out[k]=o;});
  out.tomb=tomb; out.updatedAt=Math.max(L.updatedAt||0,R.updatedAt||0); return normalize(out);
}

const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function deriveKey(pass,saltB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(saltB64),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}
async function encryptStr(str){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},cryptoKey,new TextEncoder().encode(str)); return {iv:b64e(iv),data:b64e(ct)}; }
async function decryptDoc(d,key){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(d.iv)},key,b64d(d.data)); return new TextDecoder().decode(pt); }
async function saveKey(){ try{ const jwk=await crypto.subtle.exportKey("jwk",cryptoKey); localStorage.setItem("frogpond.key",JSON.stringify(jwk)); }catch(e){} }
async function loadKey(){ try{ const j=localStorage.getItem("frogpond.key"); if(j) cryptoKey=await crypto.subtle.importKey("jwk",JSON.parse(j),{name:"AES-GCM"},true,["encrypt","decrypt"]); }catch(e){ cryptoKey=null; } }

function docRef(){ return fs.doc("users/"+fbUser.uid+"/data/main"); }
let firstSnap=false;
function onUser(u){
  fbUser=u||null; firstSnap=true; if(unsub){unsub();unsub=null;}
  if(!fbUser){ locked=null; setSync("local"); render(); return; }
  setSync("saving"); render();
  unsub=docRef().onSnapshot(snap=>{ handleRemote(snap); },err=>{ console.warn("Sync stopped:",err&&err.code,err); setSync("error"); render(); });

async function handleRemote(snap){
  if(snap.metadata.hasPendingWrites) return;
  if(!snap.exists){ locked=null; firstSnap=false; pushNow(); return; }
  const d=snap.data(); lastDoc=d;
  let remote;
  if(d.enc){
    cfg.lock=true; cfg.salt=d.salt; saveCfg();
    if(!cryptoKey){ locked=true; setSync("locked"); render(); return; }
    try{ remote=JSON.parse(await decryptDoc(d,cryptoKey)); }catch(e){ cryptoKey=null; locked=true; setSync("locked"); render(); return; }
  } else { cfg.lock=false; saveCfg(); try{ remote=JSON.parse(d.json||"{}"); }catch(e){ remote={}; } }
  locked=null;
  const R=normalize(remote);
  if(firstSnap){ firstSnap=false; const keep=new Set([...R.tasks,...R.goals].map(x=>x.id)); state.tasks=state.tasks.filter(x=>!x.ex||keep.has(x.id)); state.goals=state.goals.filter(x=>!x.ex||keep.has(x.id)); }
  const merged=mergeState(state,R);
  const localChanged=JSON.stringify(merged)!==JSON.stringify(state);
  state=merged; prevSig=sigOf(state); saveLocal();
  if(localChanged) render();
  if(JSON.stringify(merged)!==JSON.stringify(R)) schedulePush(300); else setSync("synced");
}
function schedulePush(ms){ if(!fbUser||locked) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,ms==null?800:ms); }
async function pushNow(){
  if(!fbUser||locked) return;
  if(writing){ pendingPush=true; return; }
  writing=true; setSync(navigator.onLine?"saving":"offline");
  try{
    const json=JSON.stringify(state); let doc;
    if(cfg.lock&&cryptoKey){ const e=await encryptStr(json); doc={v:2,enc:true,salt:cfg.salt,iv:e.iv,data:e.data,updatedAt:state.updatedAt||Date.now()}; }
    else doc={v:2,enc:false,json,updatedAt:state.updatedAt||Date.now()};
    await docRef().set(doc); setSync("synced");
  }catch(e){ setSync(navigator.onLine?"error":"offline"); }
  writing=false; if(pendingPush){ pendingPush=false; pushNow(); }
}

    ${locked?`<form class="stack" data-form="unlock"><p class="small"><b>Your data is locked with a passphrase.</b> Type it once on this device to unlock.</p>
      <label class="field">Passphrase<input type="password" id="unlock-pass" autocomplete="off" required></label><button class="btn btn-primary">${I("key")}Unlock</button></form>`
    :cfg.lock?`<div class="notice">${I("lock")}<p><b>Extra lock is on.</b> Your plan is encrypted on this device before upload. Even Google can't read it.</p></div><button class="btn btn-ghost btn-sm" data-act="lockoff">Turn extra lock off</button>`
    :disc("lock","Extra lock (optional)",`<form class="stack" data-form="lockon"><p class="small muted">Scrambles your plan with a passphrase before upload, so only your devices can read it. <b>If you forget the passphrase, synced data can't be recovered</b> (this device keeps its copy). Write it down.</p>
      <label class="field">Passphrase (8+ characters)<input type="password" id="lock-p1" minlength="8" autocomplete="new-password" required></label>
      <label class="field">Type it again<input type="password" id="lock-p2" minlength="8" autocomplete="new-password" required></label>
      <button class="btn btn-primary">Turn on extra lock</button></form>`)}
    ${alert}
    </div>
    <button class="cell" data-act="signout">${I("out")}<span class="txt">Sign out<small>Your plan stays on this device</small></span></button>
    <button class="cell danger" data-act="signoutwipe">${I("trash")}<span class="txt">Sign out and remove data from this device<small>Use this on a shared computer</small></span></button>
  </section>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(a==="gosync"){ ui.tab="me"; saveUI(); render(); const c=document.getElementById("sync-card"); if(c) c.scrollIntoView({behavior:"smooth"}); }
  else if(a==="retryfb"){ fbFailed=false; render(); startFirebase(); }
  else if(a==="retrysync"){ if(fbUser){ toast("Trying again…"); onUser(fbUser); } }
  else if(a==="google"){ authMsg=""; const pr=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(pr).catch(err=>{ if(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(pr); else { authMsg=authError(err); render(); } }); }
  else if(a==="resetpw"){ const em=(document.getElementById("acc-email")||{}).value; if(!em){ authMsg="Type your email first, then tap Forgot password."; render(); return; }
    auth.sendPasswordResetEmail(em.trim()).then(()=>{authMsg="Password reset email sent. Check your inbox.";render();}).catch(err=>{authMsg=authError(err);render();}); }
  else if(a==="signout"){ await auth.signOut(); authMsg=""; toast("Signed out. Your plan stays on this device."); }
  else if(a==="signoutwipe"){ await auth.signOut(); try{["frogpond.v2","frogpond.v1","frogpond.key","frogpond.cfg","frogpond.prev","frogpond.ui"].forEach(k=>localStorage.removeItem(k));}catch(x){} cfg.key=""; ai=null; cryptoKey=null; cfg.lock=false; cfg.salt=""; saveCfg(); state=normalize({}); prevSig=null; saveLocal(); render(); toast("Signed out. This device is clean."); }
  else if(a==="lockoff"){ cfg.lock=false; saveCfg(); cryptoKey=null; try{localStorage.removeItem("frogpond.key")}catch(x){} pushNow(); render(); toast("Extra lock off."); }
});
document.addEventListener("submit",async e=>{
  const f=e.target, kind=f.dataset.form;
  if(kind==="auth"){ e.preventDefault(); const mode=(e.submitter&&e.submitter.dataset.mode)||"in";
    const em=document.getElementById("acc-email").value.trim(), pw=document.getElementById("acc-pass").value;
    authBusy=true; authMsg=""; render();
    try{ if(mode==="up") await auth.createUserWithEmailAndPassword(em,pw); else await auth.signInWithEmailAndPassword(em,pw); toast("Signed in. Syncing your plan…"); }
    catch(err){ authMsg=authError(err); }
    authBusy=false; render(); }
  else if(kind==="lockon"){ e.preventDefault(); const p1=document.getElementById("lock-p1").value, p2=document.getElementById("lock-p2").value;
    if(p1.length<8){ authMsg="Passphrase needs 8+ characters."; render(); return; }
    if(p1!==p2){ authMsg="The two passphrases don't match."; render(); return; }
    cfg.salt=b64e(crypto.getRandomValues(new Uint8Array(16))); cryptoKey=await deriveKey(p1,cfg.salt); await saveKey(); cfg.lock=true; saveCfg(); authMsg=""; await pushNow(); render(); toast("Extra lock is on. Write the passphrase down."); }
  else if(kind==="unlock"){ e.preventDefault(); const pass=document.getElementById("unlock-pass").value; if(!lastDoc) return;
    try{ const k=await deriveKey(pass,lastDoc.salt); await decryptDoc(lastDoc,k); cryptoKey=k; await saveKey(); locked=null; authMsg=""; toast("Unlocked."); handleRemote({exists:true,metadata:{hasPendingWrites:false},data:()=>lastDoc}); }
    catch(err){ authMsg="Wrong passphrase. Try again."; render(); } }
});

// ================= PULL TO REFRESH =================
// Pull down at the very top: syncs and reloads the app (which also picks up new versions).
(function(){
  const el=document.getElementById("ptr"), txt=document.getElementById("ptr-t"), MAX=110, GO=70;
  let y0=null, x0=0, dy=0, busy=false;
  const show=d=>{ const k=Math.min(d,MAX); el.style.opacity=k>8?1:0; el.style.transform=`translate(-50%,${k+56}px)`; el.querySelector("svg").style.transform=busy?"":`rotate(${k*3}deg)`; txt.textContent=busy?"Refreshing…":k>=GO?"Let go to refresh":"Pull to refresh"; };
  const reset=()=>{ el.style.transition="transform .25s, opacity .2s"; el.style.opacity=0; el.style.transform="translate(-50%,0)"; setTimeout(()=>el.style.transition="opacity .2s",260); };
  document.addEventListener("touchstart",e=>{
    if(busy||window.scrollY>0||layer.innerHTML||e.touches.length!==1||e.target.closest("input,textarea,select,.seg")){ y0=null; return; }
    y0=e.touches[0].clientY; x0=e.touches[0].clientX; dy=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(y0==null) return;
    dy=(e.touches[0].clientY-y0)*0.55;
    if(dy<=0||window.scrollY>0||Math.abs(e.touches[0].clientX-x0)>Math.abs(e.touches[0].clientY-y0)){ y0=null; reset(); return; }
    if(e.cancelable) e.preventDefault();
    show(dy);
  },{passive:false});
  document.addEventListener("touchend",async()=>{
    if(y0==null) return; y0=null;
    if(dy<GO){ reset(); return; }
    busy=true; el.classList.add("spin"); show(GO);
    try{ saveLocal(); if(typeof fbUser!=="undefined"&&fbUser&&!locked){ clearTimeout(pushTimer); await Promise.race([pushNow(),new Promise(r=>setTimeout(r,2500))]); } }catch(x){}
    try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) await Promise.race([reg.update(),new Promise(r=>setTimeout(r,1500))]); }catch(x){}
    location.reload();
  });
})();

// ================= BOOT =================
state=loadLocal()||normalize(examples()); prevSig=sigOf(state); ai=makeAI(); render();
if(!cfg.toured) openTour(0);
loadKey().then(()=>{ if(navigator.onLine) startFirebase(); else setSync("local"); });
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
